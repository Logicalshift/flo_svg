[package]
name                = "svgflo"
version             = "0.1.0"
authors             = ["Andrew Hunter <andrew@logicalshift.co.uk>"]
edition             = "2021"
license             = "Apache-2.0"
readme              = "../README.md"
description         = "Command-line tool for manipulating svg files"

[dependencies]
flo_svg             = "0.1"
flo_canvas          = "0.4"
flo_render_software = "0.4"
clap                = { version = "4.5", features = [ "derive" ] }
serde               = "1.0"
serde_json          = "1.0"
rascii_art          = "0.4"
image               = "0.24"
